appId: com.syncratic.invoicecrawler
productName: Invoice Crawler
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintrc.cjs,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!build/icon.svg'
  # These ship via extraResources below instead — pdfjs can't read them from
  # inside the asar, so the copy in here would be 2.5MB of dead weight.
  - '!node_modules/pdfjs-dist/{cmaps,standard_fonts}/**'
asarUnpack:
  # @napi-rs/canvas loads prebuilt .node binaries from a platform-specific
  # sibling package (@napi-rs/canvas-win32-x64-msvc and friends), picked at
  # runtime by its js-binding.js. dlopen can't read inside app.asar, and
  # electron-builder's smart unpacking doesn't follow that dynamic resolution,
  # so unpack the whole scope explicitly.
  - '**/node_modules/@napi-rs/**'
extraResources:
  # pdfjs reads its cmaps/ and standard_fonts/ with a plain fs.readFile, which
  # can't see inside app.asar — so these ship as real files instead. Resolved by
  # resolveAssetDir() in src/main/services/pdf-converter.ts. ~2.5MB total.
  - from: node_modules/pdfjs-dist/cmaps
    to: pdfjs/cmaps
  - from: node_modules/pdfjs-dist/standard_fonts
    to: pdfjs/standard_fonts
  # Window icon for resolveIcon() in src/main/index.ts. build/ is the
  # buildResources dir, so electron-builder doesn't package it on its own.
  - from: build/icon.png
    to: build/icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
publish:
  provider: github
  owner: Syncrose1
  repo: InvoiceCrawler
  # The release workflow builds Linux and Windows in parallel. Using `draft`
  # means the first runner creates the draft, the others append to it safely,
  # and a final `publish` job promotes the draft to a real release once all
  # both OSes have uploaded successfully — no half-published releases if one
  # platform fails.
  releaseType: draft
