appId: com.syncratic.invoicecrawler
productName: Invoice Crawler
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintrc.cjs,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!build/icon.svg'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
publish:
  provider: github
  owner: Syncrose1
  repo: InvoiceCrawler
  # The release workflow builds across three OSes in parallel. Using `draft`
  # means the first runner creates the draft, the others append to it safely,
  # and a final `publish` job promotes the draft to a real release once all
  # three OSes have uploaded successfully — no half-published releases if one
  # platform fails.
  releaseType: draft
