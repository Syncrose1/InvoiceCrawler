<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a2540" />
      <stop offset="55%" stop-color="#0f1626" />
      <stop offset="100%" stop-color="#05080f" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.40" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Rounded-square base -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none"
        stroke="#3a4f7a" stroke-opacity="0.35" stroke-width="2" />

  <!-- Soft accent glow behind the mark -->
  <circle cx="256" cy="256" r="190" fill="url(#glow)" />

  <!--
    Syncratic mark.
    Source viewBox: 210.944 0 1097.728 1024 (so a 1097.728 x 1024 box).
    We want it centred in a 512x512 canvas at ~70% size = ~358 tall.
    Scale = 358 / 1024 = 0.3496.
    Source width 1097.728 * 0.3496 = ~383.8. We want centre at x=256, so left = 256 - 191.9 = 64.1.
    But the source viewBox starts at x=210.944, so we shift by -210.944 in source units before scaling.
    Final transform: translate(64.1, 77) scale(0.3496) translate(-210.944, 0)
    Source paths use (transform="translate(0,1024) scale(0.1,-0.1)"); we'll just wrap the existing
    transform inside our own group transform — simpler and accurate.
  -->
  <g transform="translate(64.1, 77) scale(0.3496)">
    <g fill="url(#markGrad)" stroke="none" transform="translate(0,10240) scale(1,-1)">
      <path d="M5291 8310 c-704 -59 -1358 -350 -1871 -834 -547 -516 -878 -1187 -966 -1961 -23 -205 -15 -641 15 -826 57 -353 143 -628 291 -934 164 -337 352 -598 621 -860 516 -504 1124 -789 1846 -866 148 -15 590 -6 732 15 261 40 575 131 810 235 181 80 455 239 569 329 l23 18 -53 44 c-59 50 -748 646 -834 722 -20 18 -23 17 -115 -26 -125 -60 -276 -109 -434 -142 -121 -26 -147 -28 -380 -28 -223 -1 -262 1 -365 22 -683 139 -1241 633 -1468 1302 -77 226 -106 400 -106 645 -1 561 212 1062 612 1447 295 283 642 455 1047 519 122 20 448 17 570 -5 215 -38 395 -95 556 -177 l60 -30 112 98 c171 151 486 425 645 561 78 68 142 126 142 131 0 10 -224 157 -337 221 -258 145 -608 271 -928 334 -223 44 -577 64 -794 46z"/>
