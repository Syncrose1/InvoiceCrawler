name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoice-crawler

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: invoice-crawler/package-lock.json

      # canvas is a transitive dep of pdf-to-img and needs Cairo/Pango on Linux runners.
      # The other runners (mac/win) ship prebuilt binaries, so this only matters here.
      - name: Install canvas system deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # Pin Python to 3.11 — node-gyp's gyp_main.py imports `distutils`,
      # removed from 3.12's stdlib.
      - name: Set up Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
